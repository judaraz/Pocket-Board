    function renderUnitConverter() {
      const screen = document.getElementById('mainScreen');
      const units = {
        length: { name: 'Length', units: { mm: 0.001, cm: 0.01, m: 1, km: 1000, inch: 0.0254, foot: 0.3048, yard: 0.9144, mile: 1609.344 } },

        data: { name: 'Data', units: { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 } },
        time: { name: 'Time', units: { sec: 1, min: 60, hour: 3600, day: 86400 } }
      };

      let currentCat = 'length';

      function renderCategory(cat) {
        currentCat = cat;
        const catData = units[cat];
        const unitKeys = catData.special ? catData.units : Object.keys(catData.units);

        screen.innerHTML = `
          <h1 style="margin-bottom:16px;">Unit Converter</h1>
          <div class="flex gap-8 mb-16" style="overflow-x:auto; padding-bottom:4px;">
            ${Object.entries(units).map(([key, val]) => `

            `).join('')}
          </div>
          <div class="card">

              <label>From</label>
              <div class="flex gap-8">
                <input class="input" type="number" id="unitFromVal" value="1" style="flex:1;">
                <select class="select" id="unitFromUnit" style="width:auto; min-width:90px;">
                  ${unitKeys.map(u => `<option value="${u}">${u}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="input-group">
              <label>To</label>
              <div class="flex gap-8">
                <input class="input" type="number" id="unitToVal" readonly style="flex:1; background:var(--surface2);">
                <select class="select" id="unitToUnit" style="width:auto; min-width:90px;">
                  ${unitKeys.map((u, i) => `<option value="${u}" ${i === 1 ? 'selected' : ''}>${u}</option>`).join('')}
                </select>
              </div>
            </div>
            <button class="btn btn-primary btn-block" id="convertUnitBtn">Convert</button>
          </div>
        `;

        screen.querySelectorAll('[data-cat]').forEach(el => {
          el.onclick = () => renderCategory(el.dataset.cat);
        });

        document.getElementById('convertUnitBtn').onclick = () => {
          const fromVal = parseFloat(document.getElementById('unitFromVal').value);
          const fromUnit = document.getElementById('unitFromUnit').value;
          const toUnit = document.getElementById('unitToUnit').value;
          if (isNaN(fromVal)) { UI.toast('Please enter a value', 'warning'); return; }

          let result;
          if (catData.special) {
            // Temperature
            let celsius;
            if (fromUnit === 'C') celsius = fromVal;
            else if (fromUnit === 'F') celsius = (fromVal - 32) * 5/9;
            else celsius = fromVal - 273.15;

            if (toUnit === 'C') result = celsius;
            else if (toUnit === 'F') result = celsius * 9/5 + 32;
            else result = celsius + 273.15;
          } else {
            const inBase = fromVal * catData.units[fromUnit];
            result = inBase / catData.units[toUnit];
          }

          document.getElementById('unitToVal').value = parseFloat(result.toFixed(6));
        };
      }

      renderCategory('length');
    }

              <input class="input" type="number" id="timerSec" value="0" min="0" max="59">
            </div>
          </div>
          <div class="timer-controls">
            <button class="btn btn-primary" id="timerStart">Start</button>
            <button class="btn btn-secondary hidden" id="timerPause">Pause</button>
            <button class="btn btn-danger hidden" id="timerReset">Reset</button>
          </div>
        </div>
      `;

      const display = document.getElementById('timerDisplay');
      const startBtn = document.getElementById('timerStart');
      const pauseBtn = document.getElementById('timerPause');
      const resetBtn = document.getElementById('timerReset');

      function updateDisplay() {
        const totalSec = Math.ceil(remainingMs / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        display.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      startBtn.onclick = () => {
        if (!isRunning) {
          const min = parseInt(document.getElementById('timerMin').value) || 0;
          const sec = parseInt(document.getElementById('timerSec').value) || 0;
          if (remainingMs <= 0) remainingMs = (min * 60 + sec) * 1000;
          if (remainingMs <= 0) { UI.toast('Please set a time', 'warning'); return; }

          isRunning = true;
          startBtn.classList.add('hidden');
          pauseBtn.classList.remove('hidden');
          resetBtn.classList.remove('hidden');

          const endTime = Date.now() + remainingMs;
          timerInterval = setInterval(() => {
            remainingMs = endTime - Date.now();
            if (remainingMs <= 0) {
              clearInterval(timerInterval);
              remainingMs = 0;
              isRunning = false;
              updateDisplay();
              Telegram.haptic('success');
              if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
              UI.toast('Timer complete!', 'success');
              startBtn.classList.remove('hidden');
              pauseBtn.classList.add('hidden');
              return;
            }
            updateDisplay();
          }, 100);
        }
      };

      pauseBtn.onclick = () => {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.classList.remove('hidden');
        pauseBtn.classList.add('hidden');
      };

      resetBtn.onclick = () => {
        clearInterval(timerInterval);
        isRunning = false;
        remainingMs = 0;
        display.textContent = '00:00';
        startBtn.classList.remove('hidden');
        pauseBtn.classList.add('hidden');
        resetBtn.classList.add('hidden');
      };

      updateDisplay();
    }

      document.getElementById('pwLength').oninput = (e) => {

      };

      document.getElementById('generatePw').onclick = () => {
        const length = parseInt(document.getElementById('pwLength').value);
        const useUpper = document.getElementById('pwUpper').checked;
        const useLower = document.getElementById('pwLower').checked;
        const useNumbers = document.getElementById('pwNumbers').checked;
        const useSymbols = document.getElementById('pwSymbols').checked;

        let chars = '';
        if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
        if (useNumbers) chars += '0123456789';
        if (useSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

        if (!chars) { UI.toast('Select at least one character type', 'warning'); return; }

        // Cryptographically secure random
        const array = new Uint32Array(length);
        crypto.getRandomValues(array);
        let password = '';
        for (let i = 0; i < length; i++) {
          password += chars[array[i] % chars.length];
        }

        document.getElementById('pwResult').textContent = password;

        // Strength indicator
        let strength = 0;
        if (length >= 12) strength++;
        if (length >= 16) strength++;
        if (useUpper && useLower) strength++;
        if (useNumbers) strength++;
        if (useSymbols) strength++;

        const strengthEl = document.getElementById('pwStrength');
        if (strength <= 2) { strengthEl.textContent = 'Weak'; strengthEl.style.color = 'var(--danger)'; }
        else if (strength <= 3) { strengthEl.textContent = 'Medium'; strengthEl.style.color = 'var(--warning)'; }
        else { strengthEl.textContent = 'Strong'; strengthEl.style.color = 'var(--success)'; }

        Telegram.haptic('success');
      };

      document.getElementById('copyPw').onclick = () => {
        const pw = document.getElementById('pwResult').textContent;
        if (pw && pw !== 'Click generate') UI.copyToClipboard(pw);
      };
    }

    function generateUUIDv4Fallback() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

          const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          document.getElementById('hashOutput').value = hashHex;
          Telegram.haptic('success');
        } catch(e) {
          UI.toast('Hashing failed', 'error');
        }
      };

      document.getElementById('copyHash').onclick = () => {

        if (h) UI.copyToClipboard(h);

    // -------------------- DATA EXPORT/IMPORT --------------------
    async function exportData() {
      const data = {
        version: 1,
        exportedAt: new Date().toISOString(),
        notes: State.notes,
        tasks: State.tasks,
        links: State.links,
        settings: State.settings
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      UI.downloadBlob(blob, `pocketboard-backup-${new Date().toISOString().split('T')[0]}.json`);
      UI.toast('Data exported', 'success');
      Telegram.haptic('success');
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);

          // Validate
          if (!data || typeof data !== 'object') throw new Error('Invalid JSON');
          if (!Array.isArray(data.notes) && !Array.isArray(data.tasks) && !Array.isArray(data.links)) {
            throw new Error('Invalid data structure');
          }

          UI.confirm('Import your PocketBoard data? Existing data will be preserved.', async () => {
            // Import notes
            if (Array.isArray(data.notes)) {
              for (const note of data.notes) {
                if (note.id && note.title !== undefined) {
                  await Storage.put('notes', note);
                }
              }
            }
            // Import tasks
            if (Array.isArray(data.tasks)) {
              for (const task of data.tasks) {
                if (task.id && task.title !== undefined) {
                  await Storage.put('tasks', task);
                }
              }
            }
            // Import links
            if (Array.isArray(data.links)) {
              for (const link of data.links) {
                if (link.id && link.url) {
                  await Storage.put('links', link);
                }
              }
            }
            // Import settings
            if (data.settings && typeof data.settings === 'object') {
              State.settings = { ...State.settings, ...data.settings };
              State.saveSettings();
              applyTheme();
            }

            // Reload state
            await State.loadAll();
            UI.toast('Data imported successfully', 'success');
            Telegram.haptic('success');
            renderSettings();
          }, 'Import', false);
        } catch(err) {
          UI.toast('Invalid backup file', 'error');
        }
        input.value = '';
      };
      input.click();
    }

      btn.onclick = () => {
        step++;
        if (step >= steps.length) {
          State.settings.onboardingDone = true;
          State.saveSettings();
          onboarding.classList.add('hidden');
          switchTab('home');
        } else {
          renderStep();
        }
        Telegram.haptic('light');
      };

      renderStep();
    }

    // Start the app
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
