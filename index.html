<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PocketBoard — Privacy Tools</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface2: #f0f2f6;
    --text: #1a1e2b;
    --muted: #6b7280;
    --border: #e2e6ee;
    --accent: #5B5FEF;
    --accentSoft: #eef0ff;
    --danger: #e5484d;
    --success: #30a46c;
    --warning: #e5a000;
    --radius: 16px;
    --radius-sm: 12px;
    --shadow: 0 4px 14px rgba(0,0,0,0.06);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --nav-height: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --transition: 0.2s ease;
  }
  [data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #252833;
    --text: #f0f2f7;
    --muted: #9ca3af;
    --border: #2d3140;
    --accent: #7c7ff5;
    --accentSoft: #1e2040;
    --danger: #f2555a;
    --success: #3dd68c;
    --warning: #f5b82e;
    --shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    transition: background var(--transition), color var(--transition);
    display: flex;
    flex-direction: column;
    max-width: 100vw;
    overflow-x: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 100vw; position: relative; }
  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 16px calc(var(--nav-height) + var(--safe-bottom) + 16px);
    -webkit-overflow-scrolling: touch;
  }
  .screen::-webkit-scrollbar { width: 4px; }
  .screen::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-height) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 8px 10px; border-radius: var(--radius-sm);
    background: none; border: none; color: var(--muted);
    font-size: 10px; font-weight: 500; font-family: var(--font);
    cursor: pointer; transition: color var(--transition), background var(--transition);
    min-width: 64px; min-height: 48px;
  }
  .nav-item.active { color: var(--accent); background: var(--accentSoft); }
  .nav-item .nav-icon { font-size: 20px; line-height: 1; }
  .nav-item .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }

  h1 { font-size: 24px; font-weight: 700; line-height: 1.3; }
  h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; line-height: 1.5; color: var(--muted); }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .card + .card { margin-top: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 20px; border-radius: var(--radius-sm); border: none;
    font-size: 14px; font-weight: 600; font-family: var(--font);
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    min-height: 44px; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; pointer-events: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-sm { padding: 8px 14px; font-size: 12px; min-height: 36px; }
  .btn-block { width: 100%; }

  .input, .textarea, .select {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 14px; font-family: var(--font); outline: none;
    transition: border var(--transition), box-shadow var(--transition);
    min-height: 44px;
  }
  .input:focus, .textarea:focus, .select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accentSoft);
  }
  .textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 200;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    width: 100%; max-width: 500px;
    max-height: 85dvh; overflow-y: auto;
    padding: 20px 16px calc(20px + var(--safe-bottom));
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-close {
    background: none; border: none; font-size: 22px; color: var(--muted);
    cursor: pointer; padding: 4px; line-height: 1;
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
  }

  .toast-container {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 300; display: flex; flex-direction: column; gap: 8px;
    align-items: center; pointer-events: none; width: 90%; max-width: 400px;
  }
  .toast {
    background: var(--surface); color: var(--text);
    padding: 12px 18px; border-radius: var(--radius-sm);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); animation: toastIn 0.3s ease;
    display: flex; align-items: center; gap: 8px; pointer-events: auto;
  }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.error { border-left: 4px solid var(--danger); }
  .toast.info { border-left: 4px solid var(--accent); }
  .toast.warning { border-left: 4px solid var(--warning); }
  @keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .tool-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  @media (min-width: 500px) { .tool-grid { grid-template-columns: repeat(3, 1fr); } }
  .tool-card {
    background: var(--surface); border-radius: var(--radius-sm);
    padding: 18px 14px; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
    cursor: pointer; transition: background var(--transition), transform 0.1s;
  }
  .tool-card:active { transform: scale(0.97); background: var(--surface2); }
  .tool-card .tc-icon { font-size: 26px; line-height: 1; }
  .tool-card .tc-label { font-size: 13px; font-weight: 600; color: var(--text); }
  .tool-card .tc-desc { font-size: 11px; color: var(--muted); }

  .image-preview {
    width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border);
    margin-bottom: 12px; max-height: 300px; object-fit: contain; background: var(--surface2);
  }
  .stat-row {
    display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;
  }
  .stat-row .stat-label { color: var(--muted); }
  .stat-row .stat-value { font-weight: 600; }

  .empty-state { text-align: center; padding: 40px 20px; }
  .empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state .es-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .empty-state .es-desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .privacy-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accentSoft); color: var(--accent);
    padding: 6px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    margin-bottom: 16px;
  }

  .onboarding-screen {
    position: fixed; inset: 0; background: var(--bg);
    z-index: 500; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px; text-align: center;
  }
  .onboarding-screen .ob-logo {
    width: 80px; height: 80px; border-radius: 22px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(91, 95, 239, 0.3);
  }
  .onboarding-screen h1 { margin-bottom: 8px; }
  .onboarding-screen p { margin-bottom: 32px; max-width: 300px; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color var(--transition), background var(--transition);
    margin-bottom: 16px;
  }
  .drop-zone:active, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accentSoft);
  }
  .drop-zone .dz-icon { font-size: 40px; margin-bottom: 8px; }
  .drop-zone .dz-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .drop-zone .dz-desc { font-size: 12px; color: var(--muted); }

  .spinner {
    width: 24px; height: 24px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .flex { display: flex; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-8 { gap: 8px; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .text-muted { color: var(--muted); }
  .text-sm { font-size: 12px; }
  .text-center { text-align: center; }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="onboarding" class="onboarding-screen hidden">
    <div class="ob-logo">🔒</div>
    <h1>PocketBoard</h1>
    <p>Handle sensitive files and text without uploading them. Everything runs on your device.</p>
    <button class="btn btn-primary btn-block" id="onboardingBtn" style="max-width:280px;">Get Started</button>
  </div>

  <main class="screen" id="mainScreen"></main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-tab="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" data-tab="tools">
      <span class="nav-icon">🧰</span>
      <span class="nav-label">Tools</span>
    </button>
    <button class="nav-item" data-tab="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Settings</span>
    </button>
  </nav>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
'use strict';

// ============================================================
// POCKETBOARD — Privacy Tools
// Local-only file and text utilities for Telegram
// ============================================================

const CONFIG = {
  APP_VERSION: '1.0.0',
  MAX_FILE_SIZE: 20 * 1024 * 1024,
  API_BASE_URL: '', // set to your Vercel domain if the Mini App is served elsewhere
  SEND_FILE_ENDPOINT: '/api/send-file'
};

// -------------------- TELEGRAM --------------------
const Telegram = (() => {
  let tg = null;
  let user = null;
  let isAvailable = false;

  function init() {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      isAvailable = true;
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('secondary_bg_color'); } catch(e) {}
      try { tg.setBackgroundColor('bg_color'); } catch(e) {}
      user = tg.initDataUnsafe?.user || null;
    } else {
      user = { id: null, first_name: 'Guest', username: null };
    }
    return { tg, user, isAvailable };
  }

  function getTheme() {
    if (isAvailable && tg?.colorScheme) return tg.colorScheme;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function haptic(type) {
    if (!isAvailable || !tg?.HapticFeedback) return;
    try {
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      else if (type === 'warning') tg.HapticFeedback.notificationOccurred('warning');
      else tg.HapticFeedback.impactOccurred('light');
    } catch(e) {}
  }

  function getChatId() {
    // Telegram provides user id in initDataUnsafe; the bot can send to a user by their user id
    return user?.id || null;
  }

  function getUserName() {
    if (!user) return 'there';
    return user.first_name || user.username || 'there';
  }

  return { init, getTheme, haptic, getChatId, getUserName, get user() { return user; }, get isAvailable() { return isAvailable; } };
})();

// -------------------- STORAGE --------------------
const Storage = (() => {
  const PREFIX = 'pocketboard_';
  function getKV(key, def) {
    try {
      const val = localStorage.getItem(PREFIX + key);
      return val !== null ? JSON.parse(val) : def;
    } catch(e) { return def; }
  }
  function setKV(key, val) {
    try { localStorage.setItem(PREFIX + key, JSON.stringify(val)); } catch(e) {}
  }
  function clearAll() {
    const keys = Object.keys(localStorage).filter(k => k.startsWith(PREFIX));
    keys.forEach(k => localStorage.removeItem(k));
  }
  return { getKV, setKV, clearAll };
})();

// -------------------- STATE --------------------
const State = (() => {
  let settings = {
    theme: 'system',
    onboardingDone: false
  };
  let history = []; // processed files history

  function load() {
    settings = Storage.getKV('settings', settings);
    history = Storage.getKV('history', []);
  }
  function saveSettings() { Storage.setKV('settings', settings); }
  function addHistory(entry) {
    history.unshift(entry);
    history = history.slice(0, 20);
    Storage.setKV('history', history);
  }
  function clearHistory() {
    history = [];
    Storage.setKV('history', history);
  }
  return {
    get settings() { return settings; },
    get history() { return history; },
    load, saveSettings, addHistory, clearHistory
  };
})();

// -------------------- UI HELPERS --------------------
const UI = (() => {
  function escapeHtml(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  function toast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
    el.innerHTML = `<span>${icons[type] || ''}</span><span>${escapeHtml(message)}</span>`;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(-10px)';
      el.style.transition = 'all 0.3s';
      setTimeout(() => el.remove(), 300);
    }, 2500);
  }

  function modal(title, contentHtml, onClose) {
    const overlay = document.getElementById('modalOverlay');
    const modal = document.getElementById('modalContent');
    modal.innerHTML = `
      <div class="modal-header">
        <h2 style="margin:0;">${escapeHtml(title)}</h2>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <div id="modalBody">${contentHtml}</div>
    `;
    overlay.classList.add('active');
    document.getElementById('modalCloseBtn').onclick = () => closeModal(onClose);
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(onClose); };
    return modal;
  }

  function closeModal(cb) {
    document.getElementById('modalOverlay').classList.remove('active');
    if (cb) cb();
  }

  function confirm(message, onConfirm, confirmText = 'Confirm', danger = false) {
    modal('Confirm', `
      <p style="margin-bottom:16px;">${escapeHtml(message)}</p>
      <div class="flex gap-8">
        <button class="btn btn-secondary btn-block" id="confirmCancel">Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'} btn-block" id="confirmOk">${escapeHtml(confirmText)}</button>
      </div>
    `);
    document.getElementById('confirmCancel').onclick = () => closeModal();
    document.getElementById('confirmOk').onclick = () => { closeModal(); onConfirm(); };
  }

  function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return d.toLocaleDateString();
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => {
        toast('Copied to clipboard', 'success');
        Telegram.haptic('success');
      }).catch(() => fallbackCopy(text));
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast('Copied to clipboard', 'success');
      Telegram.haptic('success');
    } catch(e) {
      toast('Failed to copy', 'error');
    }
    document.body.removeChild(ta);
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
  }

  return { escapeHtml, toast, modal, closeModal, confirm, formatBytes, formatDate, copyToClipboard, generateId };
})();

// -------------------- FILE DELIVERY --------------------
// Primary: send via bot. Fallback: long-press save.
const FileDelivery = (() => {
  async function sendViaBot(blob, filename) {
    const chatId = Telegram.getChatId();
    if (!chatId) {
      return { ok: false, reason: 'no_chat_id' };
    }

    // Convert blob to base64
    const base64 = await blobToBase64(blob);

    // Read the secret from a data attribute or meta tag. In production,
    // the Mini App can fetch this from the bot's /start message, but for
    // simplicity we expect it to be injected at build time or via env.
    // For now, we assume the endpoint checks the Telegram initData signature
    // OR the secret is stored in localStorage after first use.
    // Recommended: backend validates initData instead of a shared secret.
    const secret = window.__POCKETBOARD_SECRET || '';

    try {
      const res = await fetch(CONFIG.SEND_FILE_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-pocketboard-secret': secret
        },
        body: JSON.stringify({
          chatId,
          imageBase64: base64,
          filename: filename || 'pocketboard.png',
          caption: '📎 Sent from PocketBoard'
        })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        return { ok: false, reason: data.error || 'server_error' };
      }
      return { ok: true };
    } catch (err) {
      return { ok: false, reason: 'network_error' };
    }
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // Fallback: show the image in a modal so the user can long-press / right-click to save
  function showSaveModal(blob, filename) {
    const url = URL.createObjectURL(blob);
    UI.modal('Save Image', `
      <p class="text-sm text-muted mb-8">Long-press (mobile) or right-click (desktop) the image below and choose "Save Image".</p>
      <img src="${url}" style="width:100%; border-radius:12px; border:1px solid var(--border); margin-bottom:12px;" alt="Result">
      <button class="btn btn-primary btn-block" id="closeSaveModal">Done</button>
    `, () => URL.revokeObjectURL(url));
    document.getElementById('closeSaveModal').onclick = () => UI.closeModal(() => URL.revokeObjectURL(url));
  }

  async function deliver(blob, filename) {
    // Try bot delivery first
    const result = await sendViaBot(blob, filename);
    if (result.ok) {
      UI.toast('Sent to your Telegram chat', 'success');
      Telegram.haptic('success');
      return true;
    }
    // Fallback: show save modal
    if (result.reason === 'no_chat_id') {
      UI.toast('Open this app inside Telegram to receive files', 'warning');
    } else {
      UI.toast('Bot delivery unavailable — saving locally', 'warning');
    }
    showSaveModal(blob, filename);
    return false;
  }

  return { deliver, showSaveModal };
})();

// -------------------- IMAGE TOOLS --------------------
const ImageTools = (() => {
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      if (!file.type.startsWith('image/')) {
        reject(new Error('Invalid file type'));
        return;
      }
      if (file.size > CONFIG.MAX_FILE_SIZE) {
        reject(new Error('File too large (max 20MB)'));
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed to load image'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('Failed to read file'));
      reader.readAsDataURL(file);
    });
  }

  function compress(img, quality = 0.7, format = 'image/jpeg', maxWidth = null) {
    const canvas = document.createElement('canvas');
    let w = img.width, h = img.height;
    if (maxWidth && w > maxWidth) {
      h = Math.round(h * (maxWidth / w));
      w = maxWidth;
    }
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    if (format === 'image/jpeg') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
    }
    ctx.drawImage(img, 0, 0, w, h);
    return new Promise((resolve) => {
      canvas.toBlob((blob) => resolve({ blob, width: w, height: h, canvas }), format, quality);
    });
  }

  function resize(img, newWidth, newHeight) {
    const canvas = document.createElement('canvas');
    canvas.width = newWidth;
    canvas.height = newHeight;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, newWidth, newHeight);
    return canvas;
  }

  function convert(img, format = 'image/png', quality = 0.9) {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    if (format === 'image/jpeg') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.drawImage(img, 0, 0);
    return new Promise((resolve) => {
      canvas.toBlob((blob) => resolve({ blob, canvas }), format, quality);
    });
  }

  function crop(img, x, y, w, h) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, x, y, w, h, 0, 0, w, h);
    return canvas;
  }

  function blurRegion(canvas, x, y, w, h, intensity = 10) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.filter = `blur(${intensity}px)`;
    ctx.drawImage(canvas, 0, 0);
    ctx.restore();
    ctx.filter = 'none';
    return canvas;
  }

  function pixelateRegion(canvas, x, y, w, h, pixelSize = 10) {
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(x, y, w, h);
    const data = imageData.data;
    const cols = Math.ceil(w / pixelSize);
    const rows = Math.ceil(h / pixelSize);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const px = c * pixelSize;
        const py = r * pixelSize;
        const idx = (py * w + px) * 4;
        if (idx < data.length) {
          const rVal = data[idx], gVal = data[idx+1], bVal = data[idx+2];
          for (let dy = 0; dy < pixelSize && py + dy < h; dy++) {
            for (let dx = 0; dx < pixelSize && px + dx < w; dx++) {
              const di = ((py + dy) * w + (px + dx)) * 4;
              data[di] = rVal;
              data[di+1] = gVal;
              data[di+2] = bVal;
            }
          }
        }
      }
    }
    ctx.putImageData(imageData, x, y);
    return canvas;
  }

  function canvasToBlob(canvas, format = 'image/png', quality = 0.9) {
    return new Promise((resolve) => {
      canvas.toBlob((blob) => resolve(blob), format, quality);
    });
  }

  return { loadImage, compress, resize, convert, crop, blurRegion, pixelateRegion, canvasToBlob };
})();

// -------------------- HASH / TEXT TOOLS --------------------
const TextTools = (() => {
  async function hash(text, algo = 'SHA-256') {
    const data = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest(algo, data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function base64Encode(text) {
    const bytes = new TextEncoder().encode(text);
    const binary = Array.from(bytes, b => String.fromCharCode(b)).join('');
    return btoa(binary);
  }

  function base64Decode(b64) {
    const binary = atob(b64.trim());
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function generatePassword(length = 16, opts = {}) {
    let chars = '';
    if (opts.upper !== false) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (opts.lower !== false) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (opts.numbers !== false) chars += '0123456789';
    if (opts.symbols !== false) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if (!chars) return '';
    const array = new Uint32Array(length);
    crypto.getRandomValues(array);
    let pw = '';
    for (let i = 0; i < length; i++) pw += chars[array[i] % chars.length];
    return pw;
  }

  function generateUUID() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  return { hash, base64Encode, base64Decode, generatePassword, generateUUID };
})();

    case 'imgcrop': renderImageCropper(); break;

    case 'imgpixelate': renderImageEffect('pixelate'); break;
    case 'imgmetadata': renderMetadataCleaner(); break;
    case 'hash': renderHashTool(); break;
    case 'base64': renderBase64Tool(); break;
    case 'password': renderPasswordTool(); break;
    case 'uuid': renderUUIDTool(); break;
    default: UI.toast('Tool not available', 'error');
  }
}

function openToolWithFile(toolId, file) {
  // Store the file temporarily, then open the tool and auto-load it
  window.__pendingFile = file;
  openTool(toolId);
}

  document.getElementById('backBtn').onclick = () => switchTab('home');

    try {
      img = await ImageTools.loadImage(file);
      document.getElementById('preview').classList.remove('hidden');
      document.getElementById('previewImg').src = img.src;
      document.getElementById('cw').value = img.width;
      document.getElementById('ch').value = img.height;
    } catch(err) { UI.toast(err.message, 'error'); }
  }

  document.getElementById('fileInput').onchange = (e) => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    e.target.value = '';

    const r = parseFloat(e.target.value);
    if (!isNaN(r)) {

      document.getElementById('ch').value = Math.round(w / r);

  };

  document.getElementById('processBtn').onclick = async () => {

    document.getElementById('saveBtn').onclick = () => FileDelivery.showSaveModal(blob, 'cropped.png');
  };

    const f = window.__pendingFile;
    window.__pendingFile = null;
    handleFile(f);
  }
}

// -------------------- TOOL: IMAGE BLUR / PIXELATE --------------------
function renderImageEffect(mode) {
  const screen = document.getElementById('mainScreen');
  const isBlur = mode === 'blur';
  screen.innerHTML = `
    <div class="flex items-center justify-between mb-16">
      <h1 style="margin:0;">${isBlur ? 'Blur' : 'Pixelate'}</h1>
      <button class="btn btn-secondary btn-sm" id="backBtn">← Back</button>
    </div>
    <div class="card">
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <button class="btn btn-primary btn-block" id="selectBtn">📁 Select image</button>
      <div id="preview" class="mt-16 hidden">
        <canvas id="canvas" style="width:100%; border-radius:12px; border:1px solid var(--border); max-height:300px; object-fit:contain;"></canvas>
        <p class="text-sm text-muted mt-8">Enter coordinates to select the region to ${isBlur ? 'blur' : 'pixelate'}.</p>
        <div class="flex gap-8">
          <div class="input-group" style="flex:1;"><label>X</label><input class="input" type="number" id="fx" value="0" min="0"></div>
          <div class="input-group" style="flex:1;"><label>Y</label><input class="input" type="number" id="fy" value="0" min="0"></div>
        </div>
        <div class="flex gap-8">
          <div class="input-group" style="flex:1;"><label>Width</label><input class="input" type="number" id="fw" value="100" min="1"></div>
          <div class="input-group" style="flex:1;"><label>Height</label><input class="input" type="number" id="fh" value="100" min="1"></div>
        </div>
        <div class="input-group">
          <label>${isBlur ? 'Blur intensity' : 'Pixel size'}</label>
          <input class="input" type="number" id="fint" value="10" min="1" max="50">
        </div>
        <button class="btn btn-primary btn-block" id="applyBtn">Apply</button>
        <button class="btn btn-secondary btn-block mt-8" id="resetBtn">Reset</button>
      </div>
      <div id="result" class="mt-16"></div>
    </div>
  `;

  document.getElementById('backBtn').onclick = () => switchTab('home');
  document.getElementById('selectBtn').onclick = () => document.getElementById('fileInput').click();

  let originalImg = null;

  async function handleFile(file) {
    try {
      originalImg = await ImageTools.loadImage(file);
      document.getElementById('preview').classList.remove('hidden');
      const canvas = document.getElementById('canvas');
      canvas.width = originalImg.width;
      canvas.height = originalImg.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(originalImg, 0, 0);
    } catch(err) { UI.toast(err.message, 'error'); }
  }

  document.getElementById('fileInput').onchange = (e) => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    e.target.value = '';
  };

  document.getElementById('applyBtn').onclick = () => {
    const canvas = document.getElementById('canvas');
    const x = parseInt(document.getElementById('fx').value) || 0;
    const y = parseInt(document.getElementById('fy').value) || 0;
    const w = parseInt(document.getElementById('fw').value) || 100;
    const h = parseInt(document.getElementById('fh').value) || 100;
    const intensity = parseInt(document.getElementById('fint').value) || 10;
    if (isBlur) ImageTools.blurRegion(canvas, x, y, w, h, intensity);
    else ImageTools.pixelateRegion(canvas, x, y, w, h, intensity);
    UI.toast('Applied', 'success');
  };

  document.getElementById('resetBtn').onclick = () => {
    if (!originalImg) return;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(originalImg, 0, 0);
  };

  // Auto-show send buttons after first apply
  const observer = new MutationObserver(() => {
    const canvas = document.getElementById('canvas');
    if (canvas && !canvas.dataset.hooked) {
      canvas.dataset.hooked = 'true';
      const resultEl = document.getElementById('result');
      if (resultEl && !resultEl.innerHTML) {
        resultEl.innerHTML = `
          <button class="btn btn-primary btn-block mt-16" id="sendBtn">📤 Send to Telegram</button>
          <button class="btn btn-secondary btn-block mt-8" id="saveBtn">Save locally</button>
        `;
        document.getElementById('sendBtn').onclick = async () => {
          const blob = await ImageTools.canvasToBlob(canvas, 'image/png');
          State.addHistory({ tool: isBlur ? 'Blur' : 'Pixelate', filename: 'result.png', timestamp: Date.now() });
          FileDelivery.deliver(blob, `${mode}-${Date.now()}.png`);
        };
        document.getElementById('saveBtn').onclick = async () => {
          const blob = await ImageTools.canvasToBlob(canvas, 'image/png');
          FileDelivery.showSaveModal(blob, `${mode}.png`);
        };
      }
    }
  });
  observer.observe(document.getElementById('preview'), { childList: true, subtree: true });

  if (window.__pendingFile) {
    const f = window.__pendingFile;
    window.__pendingFile = null;
    handleFile(f);
  }
}

// -------------------- THEME --------------------
function applyTheme() {
  let theme = State.settings.theme;
  if (theme === 'system') theme = Telegram.getTheme();
  document.documentElement.setAttribute('data-theme', theme);
}

// -------------------- TAB SWITCHING --------------------
function switchTab(tab) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  switch(tab) {
    case 'home': renderHome(); break;
    case 'tools': renderTools(); break;
    case 'settings': renderSettings(); break;
  }
}

// -------------------- ONBOARDING --------------------
function showOnboarding() {
  const el = document.getElementById('onboarding');
  el.classList.remove('hidden');
  document.getElementById('onboardingBtn').onclick = () => {
    State.settings.onboardingDone = true;
    State.saveSettings();
    el.classList.add('hidden');
    switchTab('home');
    Telegram.haptic('light');
  };
}

// -------------------- INIT --------------------
async function init() {
  Telegram.init();
  State.load();
  applyTheme();

  document.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = () => {
      Telegram.haptic('light');
      switchTab(el.dataset.tab);
    };
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') UI.closeModal();
  });

  if (!State.settings.onboardingDone) {
    showOnboarding();
  } else {
    switchTab('home');
  }

  console.log('PocketBoard initialized', {
    telegram: Telegram.isAvailable,
    user: Telegram.user,
    theme: Telegram.getTheme()
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
